name: CI

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-python@v6
        with:
          python-version: 3.12
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          profile: minimal
          default: true
      - name: Build wheels - x86_64
        uses: messense/maturin-action@v1
        with:
          target: x86_64
          args: --release --out dist
      - name: Install built wheel & run tests - x86_64
        run: |
          uv pip install --system numpy pandas pytest
          uv pip install --system ZenithTA --no-deps --no-index --find-links dist --force-reinstall
          uv run pytest tests -v
      - name: Build wheels - universal2
        uses: messense/maturin-action@v1
        with:
          args: --release --universal2 --out dist
      - name: Install built wheel & run tests - universal2
        run: |
          uv pip install --system ZenithTA --no-deps --no-index --find-links dist --force-reinstall
          uv run pytest tests -v
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels
          path: dist

  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        target: [x86]
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-python@v6
        with:
          python-version: 3.12
          architecture: ${{ matrix.target }}
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          profile: minimal
          default: true
      - name: Build wheels
        uses: messense/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
      - name: Install built wheel & run tests
        run: |
          uv pip install --system numpy pandas pytest
          uv pip install --system ZenithTA --no-deps --no-index --find-links dist --force-reinstall
          uv run pytest tests -v
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels
          path: dist

  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64]
    steps:
    - uses: actions/checkout@v2
    - uses: actions/setup-python@v6
      with:
        python-version: 3.12
        architecture: x64
    - name: Install uv
      uses: astral-sh/setup-uv@v5
    - name: Build wheels
      uses: messense/maturin-action@v1
      with:
        rust-toolchain: nightly
        target: ${{ matrix.target }}
        manylinux: auto
        args: --release --out dist
    - name: Install built wheel & run tests
      run: |
        uv pip install --system numpy pandas pytest
        uv pip install --system ZenithTA --no-deps --no-index --find-links dist --force-reinstall
        uv run pytest tests -v
    - name: Upload wheels
      uses: actions/upload-artifact@v7
      with:
        name: wheels
        path: dist

  release:
    name: Release
    runs-on: ubuntu-latest
    if: "startsWith(github.ref, 'refs/tags/')"
    needs: [ macos, windows, linux ]
    steps:
      - uses: actions/download-artifact@v3
        with:
          name: wheels
      - name: Publish to PyPi
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        uses: PyO3/maturin-action@v1
        with:
          command: upload
          args: --skip-existing *